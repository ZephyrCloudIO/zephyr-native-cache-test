appId: ${APP_ID}
---
# Phase 4 (Zephyr variant): partial fix — nested-mini v3 deployed.
# Orchestrator waits for polling to show `update-toast`; this flow then
# exercises the dismiss → update-bar → restart path.

- assertVisible:
    id: 'update-toast'

- tapOn:
    id: 'update-toast-dismiss'

- extendedWaitUntil:
    visible:
      id: 'update-bar'
    timeout: 5000

- tapOn:
    id: 'update-bar-restart'

- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'stats-card'
    direction: UP
    timeout: 20000

- assertVisible:
    id: 'stats-card-version'
    text: 'v2'

- scrollUntilVisible:
    element:
      id: 'cache-info'
    direction: DOWN
- assertVisible:
    id: 'cache-info'
- assertVisible:
    id: 'cache-info-version'
    text: 'v3'
- assertNotVisible:
    id: 'error-CacheInfo'
- scrollUntilVisible:
    element:
      id: 'activity-feed'
    direction: DOWN
- assertVisible:
    id: 'activity-feed'
- assertVisible:
    id: 'activity-feed-version'
    text: 'v3'
