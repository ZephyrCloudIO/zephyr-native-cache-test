appId: com.mf.example.host
---
# Phase 3 (Zephyr variant): nested-mini rolled back to v1 (mini stays at v2).
# The orchestrator now pauses until natural polling surfaces `update-toast`.

- assertVisible:
    id: 'update-toast'

- tapOn:
    id: 'update-toast-restart'

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'stats-card'
    timeout: 20000

- assertVisible:
    id: 'stats-card-version'
    text: 'v2'

- assertVisible:
    id: 'cache-info'
- assertNotVisible:
    id: 'error-CacheInfo'
- assertVisible:
    id: 'activity-feed'
