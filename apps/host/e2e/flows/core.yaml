appId: com.mf.example.host
---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Check mini remote components
- assertVisible:
    id: 'stats-card'
- assertVisible:
    id: 'deploy-card'

# Check nestedMini remote components
- assertVisible:
    id: 'activity-feed'
- assertVisible:
    id: 'cache-info'

# Check host component
- assertVisible:
    id: 'host-info'

# Verify DevTools panel
- assertVisible:
    id: 'devtools-panel-handle'
- tapOn:
    id: 'devtools-panel-handle'
- assertVisible:
    id: 'devtools-panel-expanded'
