appId: ${APP_ID}
---
# Phase 2 (Zephyr variant): v2 deployed to real Zephyr edge.
# Mini: improved components. Nested-mini: CacheInfo crashes.
# No `devtools-check-updates` tap — the orchestrator now pauses until the
# runtime's polling loop surfaces `update-toast`, then this flow takes over.

- assertVisible:
    id: 'update-toast'

- tapOn:
    id: 'update-toast-restart'

- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'stats-card'
    direction: UP
    timeout: 20000

- assertVisible:
    id: 'stats-card-version'
    text: 'v2'

- scrollUntilVisible:
    element:
      id: 'error-CacheInfo'
    direction: DOWN
- assertVisible:
    id: 'error-CacheInfo'

- scrollUntilVisible:
    element:
      id: 'activity-feed'
    direction: DOWN
- assertVisible:
    id: 'activity-feed'
- assertVisible:
    id: 'activity-feed-version'
    text: 'v2'
