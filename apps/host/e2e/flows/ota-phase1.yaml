appId: ${APP_ID}
---
# Phase 1: v1 baseline — launch fresh, verify all components loaded

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Mini remote components
- assertVisible:
    id: 'stats-card'
- assertVisible:
    id: 'stats-card-version'
    text: 'v1'
# Nested-mini remote components
- scrollUntilVisible:
    element:
      id: 'cache-info'
    direction: DOWN
- assertVisible:
    id: 'cache-info'
- scrollUntilVisible:
    element:
      id: 'activity-feed'
    direction: DOWN
- assertVisible:
    id: 'activity-feed'
- scrollUntilVisible:
    element:
      id: 'deploy-card'
    direction: DOWN
- assertVisible:
    id: 'deploy-card'

# Host component
- scrollUntilVisible:
    element:
      id: 'host-info'
    direction: DOWN
- assertVisible:
    id: 'host-info'

# No crashes, no update toast
- assertNotVisible:
    id: 'error-CacheInfo'
- assertNotVisible:
    id: 'update-toast'

# DevTools panel accessible
- assertVisible:
    id: 'devtools-panel-handle'
