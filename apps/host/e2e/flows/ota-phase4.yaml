appId: ${APP_ID}
---
# Phase 4: Partial fix — nested-mini v3 (improvements kept, crash reverted)
# Tests the alternative UI path: dismiss toast → update bar → restart from bar.

# Trigger immediate update check
- tapOn:
    id: 'devtools-check-updates'

# Wait for update toast
- extendedWaitUntil:
    visible:
      id: 'update-toast'
    timeout: 30000

# Dismiss toast (tap "Later")
- tapOn:
    id: 'update-toast-dismiss'

# UpdateBar should now be visible (hasUpdate=true, toastExpanded=false)
- extendedWaitUntil:
    visible:
      id: 'update-bar'
    timeout: 5000

# Restart via the update bar
- tapOn:
    id: 'update-bar-restart'

# Wait for JS context reload
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'stats-card'
    direction: UP
    timeout: 20000

# Mini still v2
- assertVisible:
    id: 'stats-card-version'
    text: 'v2'

# Nested-mini v3: improved ActivityFeed kept, CacheInfo reverted (labeled v3 to mark the release)
- scrollUntilVisible:
    element:
      id: 'cache-info'
    direction: DOWN
- assertVisible:
    id: 'cache-info'
- assertVisible:
    id: 'cache-info-version'
    text: 'v3'
- assertNotVisible:
    id: 'error-CacheInfo'
- scrollUntilVisible:
    element:
      id: 'activity-feed'
    direction: DOWN
- assertVisible:
    id: 'activity-feed'
- assertVisible:
    id: 'activity-feed-version'
    text: 'v3'
