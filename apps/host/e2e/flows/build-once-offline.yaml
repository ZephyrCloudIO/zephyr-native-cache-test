appId: ${APP_ID}
---
- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: stats-card
    timeout: 90000
- assertVisible:
    id: stats-card-version
    text: ${MINI_VERSION}
- scrollUntilVisible:
    element:
      id: activity-feed
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: activity-feed-version
    text: ${NESTED_MINI_VERSION}
- runFlow:
    file: build-once-load-on-demand.yaml
- tapOn:
    id: devtools-panel-handle
- scrollUntilVisible:
    element:
      id: build-once-source-mini
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: build-once-source-mini
    text: native-cache
- assertVisible:
    id: build-once-source-nestedMini
    text: native-cache
- assertVisible:
    id: build-once-artifacts-mini
    text: ${MINI_ARTIFACT_ID}
- assertVisible:
    id: build-once-artifacts-nestedMini
    text: ${NESTED_MINI_ARTIFACT_ID}
- runFlow:
    file: build-once-offline-status.yaml
- runFlow:
    file: build-once-artifact-assertions.yaml
- tapOn:
    id: devtools-panel-handle
- runFlow:
    file: build-once-native-assertions.yaml
