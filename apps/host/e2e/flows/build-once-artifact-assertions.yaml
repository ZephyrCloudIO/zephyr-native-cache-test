appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: bundle-hash-mini
    direction: UP
    timeout: 30000
- assertVisible:
    id: bundle-hash-mini
    text: "${EXPECTED_MINI_BUNDLE_HASH}.*"
- scrollUntilVisible:
    element:
      id: bundle-hash-exposed-StatsCard
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: bundle-hash-exposed-StatsCard
    text: "${EXPECTED_STATS_HASH}.*"
- scrollUntilVisible:
    element:
      id: bundle-hash-exposed-NativeCapabilityCard
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: bundle-hash-exposed-NativeCapabilityCard
    text: "${EXPECTED_NATIVE_HASH}.*"
- scrollUntilVisible:
