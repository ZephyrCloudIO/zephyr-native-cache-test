      id: bundle-hash-exposed-DeployCard
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: bundle-hash-exposed-DeployCard
    text: "${EXPECTED_DEPLOY_HASH}.*"
- scrollUntilVisible:
