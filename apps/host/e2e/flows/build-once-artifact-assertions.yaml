      id: bundle-hash-exposed-CalorieCard
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: bundle-hash-exposed-CalorieCard
    text: "${EXPECTED_CALORIE_HASH}.*"
- scrollUntilVisible:
    element:
      id: bundle-hash-nestedMini
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: bundle-hash-nestedMini
    text: "${EXPECTED_NESTED_MINI_BUNDLE_HASH}.*"
- scrollUntilVisible:
    element:
      id: bundle-hash-exposed-ActivityFeed
    direction: DOWN
