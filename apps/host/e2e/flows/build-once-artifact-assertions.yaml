- assertVisible:
    id: bundle-hash-exposed-ActivityFeed
    text: "${EXPECTED_ACTIVITY_HASH}.*"
- scrollUntilVisible:
    element:
      id: bundle-hash-exposed-CacheInfo
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: bundle-hash-exposed-CacheInfo
    text: "${EXPECTED_CACHE_INFO_HASH}.*"
- scrollUntilVisible:
    element:
      id: bundle-hash-exposed-HydrationCard
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: bundle-hash-exposed-HydrationCard
    text: "${EXPECTED_HYDRATION_HASH}.*"
- takeScreenshot: diagnostics
