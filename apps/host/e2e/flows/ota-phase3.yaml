appId: ${APP_ID}
---
# Phase 3: Rollback nested-mini to v1 (mini stays at v2)
# Only nested-mini CDN changed. App is running from phase 2.

# Trigger immediate update check
- tapOn:
    id: 'devtools-check-updates'

# Wait for update toast
- extendedWaitUntil:
    visible:
      id: 'update-toast'
    timeout: 30000

# Restart via toast
- tapOn:
    id: 'update-toast-restart'

# Wait for JS context reload
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'stats-card'
    direction: UP
    timeout: 20000

# Mini stays at v2
- assertVisible:
    id: 'stats-card-version'
    text: 'v2'

# Nested-mini rolled back to v1 — CacheInfo works again
- scrollUntilVisible:
    element:
      id: 'cache-info'
    direction: DOWN
- assertVisible:
    id: 'cache-info'
- assertNotVisible:
    id: 'error-CacheInfo'
- scrollUntilVisible:
    element:
      id: 'activity-feed'
    direction: DOWN
- assertVisible:
    id: 'activity-feed'
